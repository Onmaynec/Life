name: Проверка проекта

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Установка библиотек
        run: python -m pip install -r requirements.txt
      - name: Проверка синтаксиса
        run: python -m compileall -q life_lab tests main.py
      - name: Проверка модели и инструментов
        run: python -m unittest discover -s tests -v
      - name: Проверка работы без окна
        run: python main.py --smoke-test
