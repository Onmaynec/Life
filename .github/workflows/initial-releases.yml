name: Публикация первых версий

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/initial-releases.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Создание тегов и архивов
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          publish() {
            version="$1"
            commit="$2"
            notes="$3"
            if ! git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
              git tag -a "$version" "$commit" -m "Life $version"
              git push origin "refs/tags/$version"
            fi
            if ! gh release view "$version" >/dev/null 2>&1; then
              git archive --format=zip --output="Life-$version.zip" "$commit"
              gh release create "$version" "Life-$version.zip" \
                --title "Life $version" --notes "$notes"
            fi
          }
          publish "v0.1.0" "c767bf7feffe07065506b4ba590013c168f28209" \
            "Первая версия Life. Классическая игра Конвея с несколькими наборами правил, готовыми структурами и импортом RLE. Отдельный режим экосистемы с растениями, травоядными и хищниками. Редактор мира, статистика, сохранения и экспорт PNG. Проверено 10 тестами."
          publish "v0.2.0" "56ee7690320170658f7abbf90ea4335ace3cc2a6" \
            "Добавлено наследование трёх признаков животных: метаболизма, зрения и плодовитости. Животные ищут пищу в пределах видимости, а усиленные признаки повышают расход энергии. В панели показываются средние значения генов. Сохранения v0.1.0 поддерживаются. Проверено 17 тестами."